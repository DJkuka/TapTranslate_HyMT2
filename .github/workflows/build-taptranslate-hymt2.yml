name: Build Tap Translate 1.125 FontFit AutoFill + Hy-MT2 Vulkan

on:
  workflow_dispatch:
  push:
    branches: [ main, vulkan-v12-integration, ocr-hybrid-prototype ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android platform, build tools, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download the exact Hy-MT2 base APK from the user's Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/DJkuka/TapTranslate_HyMT2/releases/download/1/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" \
            -o input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          echo "dfe0463c9d9c0bf39451586e4e7aa405f5721504c61f20cef9fd122618418d83  input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" | sha256sum -c -

      - name: Fetch verified Vulkan AAR and pinned llama.cpp headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/DJkuka/HyMT2_Vulkan_Standalone_Test/main/app/libs/llama-android-vulkan.aar" \
            -o app/libs/llama-android-vulkan.aar
          echo "b2a15a3e297b4107575df52711a86e6a53e1a14fff497db5acb1837abe1f49bb  app/libs/llama-android-vulkan.aar" | sha256sum -c -
          mkdir -p build/vulkan-aar
          unzip -q app/libs/llama-android-vulkan.aar -d build/vulkan-aar
          test -f build/vulkan-aar/jni/arm64-v8a/libggml-vulkan.so
          test -f build/vulkan-aar/jni/arm64-v8a/libllama.so
          git clone --depth 1 --branch b9878 https://github.com/ggml-org/llama.cpp.git upstream/llama.cpp
          test "$(git -C upstream/llama.cpp describe --tags --exact-match)" = "b9878"
          echo "LLAMA_ROOT=$GITHUB_WORKSPACE/upstream/llama.cpp" >> "$GITHUB_ENV"
          echo "VULKAN_AAR_NATIVE_DIR=$GITHUB_WORKSPACE/build/vulkan-aar/jni/arm64-v8a" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify integration inputs
        run: |
          test -s input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          test -s app/libs/llama-android-vulkan.aar
          test -s tools/apktool.jar
          test -s scripts/merge_apk.py
          test -s scripts/verify_vulkan_base_apk.py
          python3 -m py_compile scripts/merge_apk.py scripts/verify_vulkan_base_apk.py
          python3 scripts/verify_vulkan_base_apk.py input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          echo "Base APK SHA-256:"
          sha256sum input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk

      - name: Build Hy-MT2 Vulkan runtime helper and JNI extension
        run: gradle --no-daemon -PllamaRoot="$LLAMA_ROOT" -PvulkanAarNativeDir="$VULKAN_AAR_NATIVE_DIR" :app:assembleDebug

      - name: Merge Hy-MT2 runtime into the original Tap Translate APK
        run: |
          python3 scripts/merge_apk.py \
            --base-apk input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk \
            --helper-apk app/build/outputs/apk/debug/app-debug.apk \
            --apktool tools/apktool.jar \
            --work build/merge \
            --output build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Validate final unsigned APK
        run: |
          unzip -t build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK SHA-256:"
          sha256sum build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK size:"
          ls -lh build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-1.125-FontFit-AutoFill-HyMT2-Vulkan-unsigned
          path: build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          if-no-files-found: error
          retention-days: 14
