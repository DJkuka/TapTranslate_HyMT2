name: Build Tap Translate 1.125 FontFit AutoFill + Hy-MT2 Vulkan

on:
  workflow_dispatch:
  push:
    branches: [ main, vulkan-v12-integration, ocr-hybrid-prototype, ocr-paddle-prototype ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android platform, build tools, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download the exact Hy-MT2 base APK from the user's Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/DJkuka/TapTranslate_HyMT2/releases/download/1/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" \
            -o input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          echo "dfe0463c9d9c0bf39451586e4e7aa405f5721504c61f20cef9fd122618418d83  input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" | sha256sum -c -

      - name: Fetch verified Vulkan AAR and pinned llama.cpp headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/DJkuka/HyMT2_Vulkan_Standalone_Test/main/app/libs/llama-android-vulkan.aar" \
            -o app/libs/llama-android-vulkan.aar
          echo "b2a15a3e297b4107575df52711a86e6a53e1a14fff497db5acb1837abe1f49bb  app/libs/llama-android-vulkan.aar" | sha256sum -c -
          mkdir -p build/vulkan-aar
          unzip -q app/libs/llama-android-vulkan.aar -d build/vulkan-aar
          test -f build/vulkan-aar/jni/arm64-v8a/libggml-vulkan.so
          test -f build/vulkan-aar/jni/arm64-v8a/libllama.so
          git clone --depth 1 --branch b9878 https://github.com/ggml-org/llama.cpp.git upstream/llama.cpp
          test "$(git -C upstream/llama.cpp describe --tags --exact-match)" = "b9878"
          echo "LLAMA_ROOT=$GITHUB_WORKSPACE/upstream/llama.cpp" >> "$GITHUB_ENV"
          echo "VULKAN_AAR_NATIVE_DIR=$GITHUB_WORKSPACE/build/vulkan-aar/jni/arm64-v8a" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify integration inputs
        run: |
          test -s input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          test -s app/libs/llama-android-vulkan.aar
          test -s tools/apktool.jar
          test -s scripts/merge_apk.py
          test -s scripts/verify_vulkan_base_apk.py
          python3 -m py_compile scripts/merge_apk.py scripts/verify_vulkan_base_apk.py
          python3 scripts/verify_vulkan_base_apk.py input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          echo "Base APK SHA-256:"
          sha256sum input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk

      - name: Fetch pinned RT-DETR-v2 INT8 comic detector
        shell: bash
        run: |
          set -euo pipefail
          model="app/src/main/assets/models/bubble_detection/detector-v4-s_int8.onnx"
          mkdir -p "$(dirname "$model")"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector-v4-s_int8.onnx?download=true" \
            -o "$model"
          echo "5fe9e4f576e49d4e7e8b0e029d6d3cdc252abd4694113e1cae120e62c931ea79  $model" | sha256sum -c -
          test "$(stat -c%s "$model")" -eq 11120765

      - name: Fetch pinned PP-OCRv6 small ONNX models and verify hashes
        if: github.ref == 'refs/heads/ocr-paddle-prototype'
        shell: bash
        run: |
          set -euo pipefail
          det="app/src/main/assets/models/det/inference.onnx"
          rec="app/src/main/assets/models/rec/inference.onnx"
          mkdir -p "$(dirname "$det")" "$(dirname "$rec")"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/5994b4f/inference.onnx?download=true" -o "$det"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx?download=true" -o "$rec"
          echo "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  $det" | sha256sum -c -
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  $rec" | sha256sum -c -
          test "$(stat -c%s "$det")" -eq 10358784
          test "$(stat -c%s "$rec")" -eq 22247936
          cp app/src/main/assets/models/ppocrv6/rec/inference.yml app/src/main/assets/models/rec/inference.yml
          test -s app/src/main/assets/models/rec/inference.yml
          echo "PP-OCRv6 models and matching 18,708-character dictionary are ready."

      - name: Run OCR geometry and outer-ring colour unit tests
        run: gradle --no-daemon -PllamaRoot="$LLAMA_ROOT" -PvulkanAarNativeDir="$VULKAN_AAR_NATIVE_DIR" :app:testDebugUnitTest

      - name: Build Hy-MT2 Vulkan runtime helper and JNI extension
        run: gradle --no-daemon -PllamaRoot="$LLAMA_ROOT" -PvulkanAarNativeDir="$VULKAN_AAR_NATIVE_DIR" :app:assembleDebug

      - name: Verify detector model and ONNX runtime in helper APK
        shell: bash
        run: |
          set -euo pipefail
          helper="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$helper" | grep -F "assets/models/bubble_detection/detector-v4-s_int8.onnx"
          unzip -l "$helper" | grep -F "lib/arm64-v8a/libonnxruntime.so"
          unzip -l "$helper" | grep -F "lib/arm64-v8a/libonnxruntime4j_jni.so"

      - name: Merge Hy-MT2 runtime into the original Tap Translate APK
        run: |
          python3 scripts/merge_apk.py \
            --base-apk input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk \
            --helper-apk app/build/outputs/apk/debug/app-debug.apk \
            --apktool tools/apktool.jar \
            --work build/merge \
            --output build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Export live OCR call-chain smali for integration audit
        shell: bash
        run: |
          set -euo pipefail
          decoded="build/merge/base_decoded"
          trace="build/ocr-live-call-chain-trace"
          mkdir -p "$trace/smali"
          test -d "$decoded"
          for root in "$decoded"/smali*; do
            [ -d "$root" ] || continue
            for package in vh xh loh rh nf gi gf; do
              if [ -d "$root/$package" ]; then
                mkdir -p "$trace/smali/$(basename "$root")"
                cp -R "$root/$package" "$trace/smali/$(basename "$root")/"
              fi
            done
            for rel in \
              "com/tap_to_translate/snap_translate/domain/main/service/ScreenTranslateService.smali" \
              "ca/c2.smali" "u3/u.smali" "bo/t5.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "$trace/smali/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "$trace/smali/$(basename "$root")/$rel"
              fi
            done
          done
          {
            echo "=== OCR entrypoints and callbacks ==="
            grep -RInE 'Lvh/j;->|Lvh/k;->|Loh/m;->|ScreenTranslateService;->c\(' "$decoded"/smali* 2>/dev/null | head -n 1200 || true
          } > "$trace/call-sites.txt"
          {
            find "$trace/smali" -type f -name '*.smali' -print0 | sort -z | xargs -0 grep -nE '^\.class|^\.method' || true
          } > "$trace/method-index.txt"
          echo "Trace files:"
          find "$trace" -type f -printf '%p %s bytes\n' | sort

      - name: Upload live OCR call-chain trace
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-OCR-live-call-chain
          path: build/ocr-live-call-chain-trace/
          if-no-files-found: error
          retention-days: 14

      - name: Validate final unsigned APK
        run: |
          unzip -t build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK SHA-256:"
          sha256sum build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK size:"
          ls -lh build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk

      - name: Verify hybrid OCR contracts were merged into classes5.dex
        if: github.ref == 'refs/heads/ocr-hybrid-prototype' || github.ref == 'refs/heads/ocr-paddle-prototype'
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f -o build/ocr-final-check build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          root=build/ocr-final-check/smali_classes5/com/tap_to_translate/snap_translate/hymt2/ocr
          for cls in OcrRegionKind OcrFrame DetectedRegion RecognizedText OcrTextRegion OcrRegionDetector RegionTextRecognizer OcrPipelineResult HybridOcrPipeline BackgroundSample OuterRingColorEstimator BitmapOuterRingSampler RtDetrInference RtDetrInferenceOutput RtDetrOutputDecoder RtDetrModelProvider OnnxRuntimeRtDetrInference RtDetrComicRegionDetector RtDetrLiveBridge; do
            test -s "$root/$cls.smali" || { echo "Missing merged OCR class: $cls"; exit 1; }
          done
          test -s build/ocr-final-check/smali_classes5/ai/onnxruntime/OrtEnvironment.smali
          test -s build/ocr-final-check/smali_classes5/ai/onnxruntime/OrtSession.smali
          live="build/ocr-final-check/smali_classes3/vh/j.smali"
          python - <<'PY'
          from pathlib import Path
          live = Path("build/ocr-final-check/smali_classes3/vh/j.smali").read_text()
          def method_body(header):
              start = live.find(header)
              if start < 0:
                  raise SystemExit("Missing host OCR method: " + header)
              end = live.find(".end method", start)
              if end < 0:
                  raise SystemExit("Unterminated host OCR method: " + header)
              return live[start:end]
          submit = method_body(".method public final a(Lnf/e;Landroid/graphics/Bitmap;Z)V")
          result = method_body(".method public final d(Landroid/content/Context;Lnf/d;Landroid/graphics/Bitmap;Z)V")
          capture = method_body(".method public final j(Landroid/graphics/Bitmap;)V")
          expected = "RtDetrLiveBridge;->onFrame(Ljava/lang/Object;Landroid/graphics/Bitmap;)V"
          if expected not in submit:
              raise SystemExit("RT-DETR must capture the exact Bitmap submitted to ML Kit in vh/j->a")
          if "invoke-static {v0, v1}" not in submit or "move-object/from16 v1, p2" not in submit:
              raise SystemExit("ML Kit frame hook must safely copy high parameter registers into low registers")
          if expected in capture:
              raise SystemExit("Obsolete early screenshot hook remains in vh/j->j")
          if "RtDetrLiveBridge;->filter" not in result:
              raise SystemExit("RT-DETR results are not applied to the live ML Kit result")
          import re
          # Baksmali regenerates branch labels when decoding the final DEX, so
          # verify each guard through its actual branch target rather than the
          # temporary source label used by merge_apk.py.
          guard_targets = re.findall(
              r"invoke-static\s+\{v0, v2, v8, v13\}, "
              r"Lcom/tap_to_translate/snap_translate/hymt2/ocr/RtDetrLiveBridge;->allowGrouping"
              r"\(Ljava/lang/Object;Ljava/lang/Object;II\)Z\s+"
              r"move-result v20\s+if-eqz v20, (:\w+)",
              result,
          )
          if len(guard_targets) != 2 or len(set(guard_targets)) != 2:
              raise SystemExit(
                  "Expected two independent allowGrouping guards; found "
                  + repr(guard_targets)
              )
          result_lines = [line.strip() for line in result.splitlines()]
          for target in guard_targets:
              # Count standalone smali label lines without a regex. Baksmali
              # may choose :cond_N labels; whitespace is irrelevant here.
              declarations = sum(1 for line in result_lines if line == target)
              if declarations != 1:
                  raise SystemExit(
                      "Grouping guard target must have exactly one label declaration: "
                      + target + " (found " + str(declarations) + ")"
                  )
          print("Verified exact ML Kit Bitmap handoff, OCR result filter and both cross-bubble grouping guards.")
          PY
          echo "RT-DETR detector, ONNX Runtime classes and OCR pipeline are present in the unsigned APK."

      - name: Verify Paddle OCR runtime, model assets and diagnostic hook
        if: github.ref == 'refs/heads/ocr-paddle-prototype'
        shell: bash
        run: |
          set -euo pipefail
          decoded="build/ocr-final-check"
          test -s "$decoded/smali_classes5/com/paddle/ocr/PaddleOCR.smali"
          test -s "$decoded/smali_classes5/com/paddle/ocr/engine/OCREngine.smali"
          test -s "$decoded/smali_classes5/com/tap_to_translate/snap_translate/hymt2/ocr/PaddleOcrLiveBridge.smali"
          test -s "$decoded/smali_classes5/org/opencv/android/Utils.smali"
          test -s "$decoded/assets/models/det/inference.onnx"
          test -s "$decoded/assets/models/rec/inference.onnx"
          test -s "$decoded/assets/models/rec/inference.yml"
          test -s "$decoded/lib/arm64-v8a/libopencv_java4.so"
          python - <<'PY'
          from pathlib import Path
          bridge = Path("build/ocr-final-check/smali_classes5/com/tap_to_translate/snap_translate/hymt2/ocr/RtDetrLiveBridge.smali").read_text()
          if "PaddleOcrLiveBridge;->submit" not in bridge:
              raise SystemExit("Paddle diagnostic hook is missing from RT-DETR live bridge")
          print("Paddle OCR classes, OpenCV, both verified model assets and live diagnostic hook are present.")
          PY

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-1.125-FontFit-AutoFill-HyMT2-Vulkan-unsigned
          path: build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          if-no-files-found: error
          retention-days: 14
