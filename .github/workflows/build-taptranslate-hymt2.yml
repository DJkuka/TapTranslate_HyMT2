name: Build Tap Translate 1.125 with Hy-MT2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify integration inputs
        run: |
          test -s input/TapTranslate_1.125_Tesseract551_EnglishOCR_unsigned.apk
          test -s tools/apktool.jar
          test -s scripts/merge_apk.py
          python3 -m py_compile scripts/merge_apk.py
          echo "Base APK SHA-256:"
          sha256sum input/TapTranslate_1.125_Tesseract551_EnglishOCR_unsigned.apk

      - name: Build Hy-MT2 runtime helper
        run: gradle --no-daemon :app:assembleDebug

      - name: Merge Hy-MT2 runtime into the original Tap Translate APK
        run: |
          python3 scripts/merge_apk.py \
            --base-apk input/TapTranslate_1.125_Tesseract551_EnglishOCR_unsigned.apk \
            --helper-apk app/build/outputs/apk/debug/app-debug.apk \
            --apktool tools/apktool.jar \
            --work build/merge \
            --output build/out/TapTranslate_1.125_HyMT2_unsigned.apk \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Validate final unsigned APK
        run: |
          unzip -t build/out/TapTranslate_1.125_HyMT2_unsigned.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 build/out/TapTranslate_1.125_HyMT2_unsigned.apk
          echo "Final APK SHA-256:"
          sha256sum build/out/TapTranslate_1.125_HyMT2_unsigned.apk
          echo "Final APK size:"
          ls -lh build/out/TapTranslate_1.125_HyMT2_unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-1.125-HyMT2-unsigned
          path: build/out/TapTranslate_1.125_HyMT2_unsigned.apk
          if-no-files-found: error
          retention-days: 14
