name: Build Tap Translate 1.131 BubblePop Alpha Capture Fix + Hy-MT2 Vulkan
# Rebuild with the verified STQ1_0 runtime AAR checksum.
# Includes restored PP-OCR tuning controls and model self-diagnostics.

on:
  workflow_dispatch:
  push:
    branches: [ main, vulkan-v12-integration, ocr-hybrid-prototype, ocr-paddle-prototype, ocr-region-editing, ocr-region-geometry, ocr-region-gesture-presets, bubblepop-text-regions-apk219, apk219-bubblepop-preserve-hymt, taptranslate-1.125-smooth-font-resize, taptranslate-1.126-line-spacing-mask-inset, taptranslate-1.127-ppocr-settings-diagnostics, taptranslate-1.128-ppocr-219-rec-upscale, taptranslate-1.129-font-scaling-free-text, taptranslate-1.131-bubblepop-alpha-capture-fix, taptranslate-1.131-free-text-checkbox-fix, taptranslate-1.132-selection-camera-font-fix, taptranslate-1.133-floating-icon-restore ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android platform, build tools, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download the exact final APK219 Release base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/DJkuka/TapTranslate_HyMT2/releases/download/v1.125-stq1.0/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk" \
            -o input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk
          echo "ab5e3ca4fed3004668518161795c4c4c2b72ba5f3d3439f8081504b2bd0a2097  input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk" | sha256sum -c -

      - name: Fetch verified Vulkan AAR and pinned llama.cpp headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/DJkuka/Vulkan_NativeRuntime/releases/download/stq1.0-runtime/llama-android-vulkan.aar" \
            -o app/libs/llama-android-vulkan.aar
          echo "3212d7fc964ce7c1a586fa800cba2e02566695572092945574a450afa193aa98  app/libs/llama-android-vulkan.aar" | sha256sum -c -
          mkdir -p build/vulkan-aar
          unzip -q app/libs/llama-android-vulkan.aar -d build/vulkan-aar
          test -f build/vulkan-aar/jni/arm64-v8a/libggml-vulkan.so
          test -f build/vulkan-aar/jni/arm64-v8a/libllama.so
          git clone https://github.com/ffmpegkit-maintained/llama-android.git upstream/llama-android
          git -C upstream/llama-android checkout --detach 9f5469fd9fa7ea7bc7b01801923af95dc3b41d52
          git -C upstream/llama-android submodule update --init --recursive
          git -C upstream/llama-android/llama.cpp rev-parse --is-inside-work-tree | grep -qx true
          LLAMA_CPP_STQ1_COMMIT="1e411d8f5a1e23525fa3265dfb4bd76265465397"
          echo "Fetching exact STQ1_0 llama.cpp revision from submodule origin:"
          git -C upstream/llama-android/llama.cpp remote -v
          git -C upstream/llama-android/llama.cpp fetch --no-tags origin "$LLAMA_CPP_STQ1_COMMIT"
          git -C upstream/llama-android/llama.cpp checkout --detach "$LLAMA_CPP_STQ1_COMMIT"
          test "$(git -C upstream/llama-android/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_STQ1_COMMIT"
          grep -q 'GGML_TYPE_STQ1_0' upstream/llama-android/llama.cpp/ggml/include/ggml.h
          echo "LLAMA_ROOT=$GITHUB_WORKSPACE/upstream/llama-android/llama.cpp" >> "$GITHUB_ENV"
          echo "VULKAN_AAR_NATIVE_DIR=$GITHUB_WORKSPACE/build/vulkan-aar/jni/arm64-v8a" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify integration inputs
        run: |
          test -s input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk
          test -s app/libs/llama-android-vulkan.aar
          test -s tools/apktool.jar
          test -s scripts/merge_apk.py
          test -s scripts/verify_vulkan_base_apk.py
          python3 -m py_compile scripts/merge_apk.py scripts/verify_vulkan_base_apk.py
          python3 scripts/verify_vulkan_base_apk.py input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk
          echo "Base APK SHA-256:"
          sha256sum input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk

      - name: Export APK219 OCR renderer source for patch compatibility
        if: (github.ref == 'refs/heads/bubblepop-text-regions-apk219' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix'))))
        shell: bash
        run: |
          set -euo pipefail
          decoded="build/apk219-renderer-inspect"
          out="build/apk219-renderer-source"
          java -jar tools/apktool.jar d -f -o "$decoded" input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk
          mkdir -p "$out"
          for rel in smali_classes3/rh/f.smali smali_classes3/rh/g.smali smali_classes3/vh/l.smali smali_classes3/mh/p.smali res/layout/fragment_settings.xml; do
            test -s "$decoded/$rel" || { echo "Missing APK219 source: $rel"; exit 1; }
            mkdir -p "$out/$(dirname "$rel")"
            cp "$decoded/$rel" "$out/$rel"
          done
          grep -RInE 'HAWK_FIXED_FONT_SIZE|binary|goto_2|TextPaint;->setTextSize|StaticLayout' "$out/smali_classes3/rh" > "$out/renderer-markers.txt" || true
          echo "APK219 renderer sources exported."
      
      - name: Upload APK219 OCR renderer source
        if: (github.ref == 'refs/heads/bubblepop-text-regions-apk219' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix'))))
        uses: actions/upload-artifact@v4
        with:
          name: APK219-renderer-source
          path: build/apk219-renderer-source/
          if-no-files-found: error
          retention-days: 7

      - name: Fetch pinned RT-DETR-v2 INT8 comic detector
        shell: bash
        run: |
          set -euo pipefail
          model="app/src/main/assets/models/bubble_detection/detector-v4-s_int8.onnx"
          mkdir -p "$(dirname "$model")"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector-v4-s_int8.onnx?download=true" \
            -o "$model"
          echo "5fe9e4f576e49d4e7e8b0e029d6d3cdc252abd4694113e1cae120e62c931ea79  $model" | sha256sum -c -
          test "$(stat -c%s "$model")" -eq 11120765

      - name: Fetch pinned PP-OCRv6 small ONNX models and verify hashes
        if: github.ref == 'refs/heads/ocr-paddle-prototype' || github.ref == 'refs/heads/ocr-region-editing' || github.ref == 'refs/heads/ocr-region-geometry' || (github.ref == 'refs/heads/ocr-region-gesture-presets' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix')))) || (github.ref == 'refs/heads/bubblepop-text-regions-apk219' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix'))))
        shell: bash
        run: |
          set -euo pipefail
          det="app/src/main/assets/models/det/inference.onnx"
          rec="app/src/main/assets/models/rec/inference.onnx"
          mkdir -p "$(dirname "$det")" "$(dirname "$rec")"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/5994b4f/inference.onnx?download=true" -o "$det"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx?download=true" -o "$rec"
          echo "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  $det" | sha256sum -c -
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  $rec" | sha256sum -c -
          test -s "$det"
          test -s "$rec"
          cp app/src/main/assets/models/ppocrv6/rec/inference.yml app/src/main/assets/models/rec/inference.yml
          test -s app/src/main/assets/models/rec/inference.yml
          echo "PP-OCRv6 models and matching 18,708-character dictionary are ready."

      - name: Fetch pinned BubblePop page-mask model
        if: (github.ref == 'refs/heads/bubblepop-text-regions-apk219' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix' || github.ref == 'refs/heads/taptranslate-1.132-selection-camera-font-fix'))))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models/bubblepop
          base="https://raw.githubusercontent.com/xulihang/speech-balloon-segmentation/a6a5abae641891e80ef6eaf28d307c808ad5657d"
          curl --fail --location --retry 4 --retry-all-errors "$base/models/model_fp16.onnx" -o app/src/main/assets/models/bubblepop/model_fp16.onnx
          curl --fail --location --retry 4 --retry-all-errors "$base/LICENSE.bubble-pop" -o app/src/main/assets/models/bubblepop/LICENSE.bubble-pop
          test "$(stat -c%s app/src/main/assets/models/bubblepop/model_fp16.onnx)" -gt 100000
          echo "BubblePop page-mask model and license verified."

      - name: Run OCR geometry and outer-ring colour unit tests
        run: gradle --no-daemon -PllamaRoot="$LLAMA_ROOT" -PvulkanAarNativeDir="$VULKAN_AAR_NATIVE_DIR" :app:testDebugUnitTest

      - name: Build Hy-MT2 Vulkan runtime helper and JNI extension
        run: gradle --no-daemon -PllamaRoot="$LLAMA_ROOT" -PvulkanAarNativeDir="$VULKAN_AAR_NATIVE_DIR" :app:assembleDebug

      - name: Verify detector model and ONNX runtime in helper APK
        shell: bash
        run: |
          set -euo pipefail
          helper="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$helper" | grep -F "assets/models/bubble_detection/detector-v4-s_int8.onnx"
          unzip -l "$helper" | grep -F "lib/arm64-v8a/libonnxruntime.so"
          unzip -l "$helper" | grep -F "lib/arm64-v8a/libonnxruntime4j_jni.so"
          unzip -l "$helper" | grep -F "lib/arm64-v8a/libopencv_java4.so"

      - name: Merge Hy-MT2 runtime into the original Tap Translate APK
        run: |
          python3 scripts/merge_apk.py \
            --base-apk input/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk \
            --helper-apk app/build/outputs/apk/debug/app-debug.apk \
            --apktool tools/apktool.jar \
            --work build/merge \
            --output build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Export live OCR call-chain smali for integration audit
        shell: bash
        run: |
          set -euo pipefail
          decoded="build/merge/base_decoded"
          trace="build/ocr-live-call-chain-trace"
          mkdir -p "$trace/smali"
          test -d "$decoded"
          for root in "$decoded"/smali*; do
            [ -d "$root" ] || continue
            # Include the original floating-icon implementation and popup/menu classes.
            widget_package="$root/com/tap_to_translate/snap_translate/domain/main/widgets"
            if [ -d "$widget_package" ]; then
              mkdir -p "$trace/smali/$(basename "$root")/com/tap_to_translate/snap_translate/domain/main"
              cp -R "$widget_package" "$trace/smali/$(basename "$root")/com/tap_to_translate/snap_translate/domain/main/"
            fi
            # Export the floating-icon touch/menu implementation and all layouts.
            if [ -d "$root/sh" ]; then
              mkdir -p "$trace/smali/$(basename "$root")"
              cp -R "$root/sh" "$trace/smali/$(basename "$root")/"
            fi
            if [ -d "$decoded"/res/layout ]; then
              mkdir -p "$trace/res"
              cp -R "$decoded"/res/layout "$trace/res/"
            fi
            for package in vh xh loh Loh rh nf gi gf mh qh; do
              if [ -d "$root/$package" ]; then
                mkdir -p "$trace/smali/$(basename "$root")"
                cp -R "$root/$package" "$trace/smali/$(basename "$root")/"
              fi
            done
            for rel in \
              "com/tap_to_translate/snap_translate/domain/main/service/ScreenTranslateService.smali" \
              "ca/c2.smali" "u3/u.smali" "bo/t5.smali" \
              "la/s.smali" "la/v.smali" \
              "lb/b.smali" "jd/i.smali" "me/c.smali" \
              "androidx/appcompat/app/b.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "$trace/smali/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "$trace/smali/$(basename "$root")/$rel"
              fi
            done
          done
          {
            echo "=== OCR entrypoints and callbacks ==="
            grep -RInE 'Lvh/j;->|Lvh/k;->|Loh/m;->|ScreenTranslateService;->c\(' "$decoded"/smali* 2>/dev/null | head -n 1200 || true
          } > "$trace/call-sites.txt"
          {
            find "$trace/smali" -type f -name '*.smali' -print0 | sort -z | xargs -0 grep -nE '^\.class|^\.method' || true
          } > "$trace/method-index.txt"
          # Include the UI fragments involved in the current regression and their layouts.
          for root in "$decoded"/smali*; do
            [ -d "$root" ] || continue
            for rel in "mh/l.smali" "mh/p.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "$trace/smali/$(basename "$root")/mh"
                cp "$root/$rel" "$trace/smali/$(basename "$root")/$rel"
              fi
            done
          done
          mkdir -p "$trace/res/layout" "$trace/res/values"
          if [ -d "$decoded/res/menu" ]; then cp -R "$decoded/res/menu" "$trace/res/"; fi
          for rel in fragment_home.xml fragment_settings.xml fragment_translate.xml; do
            [ -f "$decoded/res/layout/$rel" ] && cp "$decoded/res/layout/$rel" "$trace/res/layout/$rel"
          done
          for rel in ids.xml public.xml; do
            [ -f "$decoded/res/values/$rel" ] && cp "$decoded/res/values/$rel" "$trace/res/values/$rel"
          done
          # Export the original Tap Translate font chooser implementation and bundled font files.
          mkdir -p "$trace/font-source"
          find "$decoded" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.ttc' \) -print | while IFS= read -r file; do
            rel="${file#"$decoded/"}"
            mkdir -p "$trace/font-source/$(dirname "$rel")"
            cp "$file" "$trace/font-source/$rel"
          done
          : > "$trace/font-class-candidates.txt"
          { grep -RIlE 'Typeface;->create|Typeface;->createFromAsset|fontFamily|font_name|fontName|fonts' "$decoded"/smali* 2>/dev/null || true; } | while IFS= read -r file; do
            rel="${file#"$decoded/"}"
            printf '%s\\n' "$rel" >> "$trace/font-class-candidates.txt"
            mkdir -p "$trace/font-source/$(dirname "$rel")"
            cp "$file" "$trace/font-source/$rel"
          done
          for dir in "$decoded"/res/values*; do
            [ -d "$dir" ] || continue
            { grep -RIlE 'font|typeface' "$dir" 2>/dev/null || true; } | while IFS= read -r file; do
              rel="${file#"$decoded/"}"
              mkdir -p "$trace/font-source/$(dirname "$rel")"
              cp "$file" "$trace/font-source/$rel"
            done
          done
          echo "Original font chooser candidates exported."
          echo "Trace files:"
          find "$trace" -type f -printf '%p %s bytes\n' | sort

      - name: Upload live OCR call-chain trace
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-OCR-live-call-chain
          path: build/ocr-live-call-chain-trace/
          if-no-files-found: error
          retention-days: 14

      - name: Validate final unsigned APK
        run: |
          unzip -t build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK SHA-256:"
          sha256sum build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          echo "Final APK size:"
          ls -lh build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk

      - name: Verify BubblePop rendering and PP-OCRv6 live handoff
        if: (github.ref == 'refs/heads/bubblepop-text-regions-apk219' || github.ref == 'refs/heads/apk219-bubblepop-preserve-hymt' || github.ref == 'refs/heads/taptranslate-1.125-smooth-font-resize' || (github.ref == 'refs/heads/taptranslate-1.126-line-spacing-mask-inset' || (github.ref == 'refs/heads/taptranslate-1.127-ppocr-settings-diagnostics' || (github.ref == 'refs/heads/taptranslate-1.128-ppocr-219-rec-upscale' || github.ref == 'refs/heads/taptranslate-1.129-font-scaling-free-text' || github.ref == 'refs/heads/taptranslate-1.131-bubblepop-alpha-capture-fix' || github.ref == 'refs/heads/taptranslate-1.131-free-text-checkbox-fix' || github.ref == 'refs/heads/taptranslate-1.132-selection-camera-font-fix'))))
        shell: bash
        run: |
          set -euo pipefail
          decoded="build/bubblepop-ppocr-final-check"
          java -jar tools/apktool.jar d -f -o "$decoded" build/out/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk
          find_one_smali() {
            local rel="$1"
            local -a matches
            mapfile -t matches < <(find "$decoded" -type f -path "*/$rel" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one DEX definition for $rel; found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }
          for cls in BubblePopPageMaskDetector BubblePopSegmenter BubbleTextLayout PaddleOcrLiveBridge RtDetrLiveBridge; do
            test -s "$(find_one_smali "com/tap_to_translate/snap_translate/hymt2/ocr/$cls.smali")"
          done
          bridge="$(find_one_smali com/tap_to_translate/snap_translate/hymt2/ocr/RtDetrLiveBridge.smali)"
          renderer_f="$(find_one_smali rh/f.smali)"
          renderer_g="$(find_one_smali rh/g.smali)"
          test -s "$decoded/assets/models/bubblepop/model_fp16.onnx"
          test -s "$decoded/assets/models/bubblepop/LICENSE.bubble-pop"
          test -s "$decoded/assets/models/det/inference.onnx"
          test -s "$decoded/assets/models/rec/inference.onnx"
          test -s "$decoded/assets/models/rec/inference.yml"
          echo "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  $decoded/assets/models/det/inference.onnx" | sha256sum -c -
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  $decoded/assets/models/rec/inference.onnx" | sha256sum -c -
          grep -q 'PaddleOcrLiveBridge;->recognizeBlocking' "$bridge"
          grep -q 'drawBubbleText' "$bridge"
          grep -q 'drawFreeText' "$bridge"
          grep -q 'FreeTextLayout' "$bridge"
          grep -q 'createOverlayBubbleMask' "$bridge"
          grep -q 'continuing OCR without region association' "$bridge"
          grep -q 'ocr_bubblepop_page_mask_enabled' "$bridge"
          grep -q 'drawBubbleText' "$renderer_f"
          grep -q 'drawBubbleText' "$renderer_g"
          grep -q 'drawFreeText' "$renderer_f"
          grep -q 'drawFreeText' "$renderer_g"
          grep -q 'drawBubbleBackground' "$bridge"
          grep -q 'drawBubbleBackground' "$renderer_f"
