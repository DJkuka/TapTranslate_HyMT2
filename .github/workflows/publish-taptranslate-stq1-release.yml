name: Publish TapTranslate 1.125 STQ1_0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-taptranslate-stq1-release.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified APK 219 build artifact
        uses: actions/download-artifact@v4
        with:
          name: TapTranslate-STQ1_0-APK219-CPUAffinity-OCR-unsigned
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44712679415
          path: dist

      - name: Verify and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          EXPECTED_SHA256="ab5e3ca4fed3004668518161795c4c4c2b72ba5f3d3439f8081504b2bd0a2097"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$APK" | sha256sum --check
          RELEASE_APK="TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk"
          mv "$APK" "dist/$RELEASE_APK"
          cd dist
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RELEASE_APK" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.125-stq1.0
          target_commitish: f17b96fae2f8f3233ad2d59296c1488b69a9ad0b
          name: TapTranslate 1.125 — Hy-MT2 STQ1_0
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/TapTranslate-1.125-HyMT2-STQ1_0-APK219-unsigned.apk
            dist/SHA256SUMS.txt
          body: |
            ## TapTranslate 1.125 — Hy-MT2 STQ1_0

            Stable release built from the verified APK 219 base.

            ### Included
            - Dual-model Hy-MT2 runtime: Q4_K_M and Tencent STQ1_0.
            - CPU affinity controls and per-core CPU frequency reporting.
            - OCR integration and corrected asynchronous translation-result delivery.
            - Native llama.cpp runtime with Vulkan support in the packaged backend.

            ### Installation notes
            - The APK is intentionally **unsigned**. Sign it with your own certificate before installing.
            - GGUF model files are not bundled; select the model file from the app's model settings.
            - SHA-256 checksum is provided as a separate release asset.

            ### Build provenance
            - Base APK 219 SHA-256: `0e0d30f30a98fa427a62d23c6fe670e9bd9781287da2515b1b8139f9332e82eb`
            - Integration commit: `f17b96fae2f8f3233ad2d59296c1488b69a9ad0b`
            - GitHub Actions build run: [44712679415](https://github.com/DJkuka/TapTranslate_HyMT2/actions/runs/44712679415)
