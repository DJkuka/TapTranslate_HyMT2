name: ML Kit isolated diagnostic and APK219 Firebase forensics
on:
  workflow_dispatch:
  push:
    branches: [ mlkit-isolation-diagnostic ]
permissions:
  contents: read
  actions: read
concurrency:
  group: mlkit-isolation-diagnostic
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone ML Kit diagnostic
        run: |
          set -euo pipefail
          gradle --no-daemon -p diagnostics/mlkit-isolated :app:assembleDebug
          gradle --no-daemon -p diagnostics/mlkit-isolated :app:dependencies --configuration debugRuntimeClasspath > mlkit-runtime-dependencies.txt
          mkdir -p diagnostics-output
          cp diagnostics/mlkit-isolated/app/build/outputs/apk/debug/app-debug.apk diagnostics-output/MLKit-Isolated-Diagnostic.apk
          apkanalyzer manifest print diagnostics-output/MLKit-Isolated-Diagnostic.apk > diagnostics-output/isolated-manifest.txt
          apkanalyzer dex packages diagnostics-output/MLKit-Isolated-Diagnostic.apk > diagnostics-output/isolated-dex-packages.txt
          unzip -t diagnostics-output/MLKit-Isolated-Diagnostic.apk | tail -n 2
      - name: Download base APK 219
        uses: actions/download-artifact@v4
        with:
          name: TapTranslate-1.125-FontFit-AutoFill-HyMT2-Vulkan-unsigned
          run-id: 43736943007
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/run219
      - name: Download failing merged APK from build 75
        uses: actions/download-artifact@v4
        with:
          name: TapTranslate-STQ1_0-APK219-unsigned
          run-id: 44307994539
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/merged75
      - name: Decode and compare all three APKs
        shell: bash
        run: |
          set -euo pipefail
          base="input/run219/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk"
          merged="input/merged75/TapTranslate_1.125_FontFit_AutoFill_HyMT2_STQ1_0_APK219_unsigned.apk"
          isolated="diagnostics-output/MLKit-Isolated-Diagnostic.apk"
          test -s "$base"
          test -s "$merged"
          test -s "$isolated"
          echo "0e0d30f30a98fa427a62d23c6fe670e9bd9781287da2515b1b8139f9332e82eb  $base" | sha256sum -c -
          mkdir -p diagnostics-output/base219 diagnostics-output/merged75 diagnostics-output/isolated
          sha256sum "$base" "$merged" "$isolated" > diagnostics-output/apk-sha256.txt
          java -jar tools/apktool.jar d -f -o build/base219 "$base" >/dev/null
          java -jar tools/apktool.jar d -f -o build/merged75 "$merged" >/dev/null
          java -jar tools/apktool.jar d -f -o build/isolated "$isolated" >/dev/null

          inspect_tree() {
            label="$1"
            root="$2"
            apk="$3"
            out="diagnostics-output/$label/firebase-component-trace.txt"
            {
              echo "=== APK ==="
              echo "$apk"
              sha256sum "$apk"
              echo
              echo "=== FIREBASE COMPONENT DISCOVERY METADATA IN MANIFEST ==="
              grep -n -B5 -A5 'com.google.firebase.components:' "$root/AndroidManifest.xml" || true
              echo
              echo "=== ML KIT / FIREBASE PROVIDERS AND SERVICES ==="
              grep -n -E 'MlKit|Firebase|firebase.components|Crashlytics|Sessions|Transport' "$root/AndroidManifest.xml" || true
              echo
              echo "=== ALL CLASSES IMPLEMENTING ComponentRegistrar ==="
              find "$root"/smali* -type f -name '*.smali' -print0 |
                while IFS= read -r -d '' f; do
                  if grep -q '^\.implements Lcom/google/firebase/components/ComponentRegistrar;' "$f"; then
                    echo "----- $f"
                    cat "$f"
                  fi
                done
              echo
              echo "=== ALL OLD/NEW COMPONENT TYPE REFERENCES ==="
              grep -R -n -E 'Lid/a;|Lcom/google/firebase/components/Component;' "$root"/smali* | head -n 2500 || true
              echo
              echo "=== DEFINITION OF id.a (IF PRESENT) ==="
              find "$root"/smali* -path '*/id/a.smali' -type f -print -exec cat {} \; || true
              echo
              echo "=== FIREBASE COMPONENT PACKAGE CLASS INVENTORY ==="
              find "$root"/smali* -path '*/com/google/firebase/components/*.smali' -type f -print | sort || true
              echo
              echo "=== ML KIT REGISTRAR CLASS INVENTORY ==="
              find "$root"/smali* -type f -name '*.smali' -print0 |
                while IFS= read -r -d '' f; do
                  if grep -q -E 'ComponentRegistrar|TextRegistrar|VisionCommonRegistrar|CommonComponentRegistrar|NaturalLanguageTranslateRegistrar' "$f"; then
                    echo "$f"
                  fi
                done
              echo
              echo "=== COMPONENT FACTORY CALL SITES ==="
              grep -R -n -E 'getComponents\(\)Ljava/util/List;|Lid/a;->|Lcom/google/firebase/components/Component;->' "$root"/smali* | head -n 2000 || true
            } > "$out"
          }

          inspect_tree base219 build/base219 "$base"
          inspect_tree merged75 build/merged75 "$merged"
          inspect_tree isolated build/isolated "$isolated"

          diff -u diagnostics-output/base219/firebase-component-trace.txt diagnostics-output/isolated/firebase-component-trace.txt > diagnostics-output/base-vs-isolated.diff || true
          diff -u diagnostics-output/isolated/firebase-component-trace.txt diagnostics-output/merged75/firebase-component-trace.txt > diagnostics-output/isolated-vs-failed-merge.diff || true
      - name: Upload three-way Firebase component analysis
        uses: actions/upload-artifact@v4
        with:
          name: MLKit-Firebase-three-way-forensics
          path: |
            diagnostics-output/
            mlkit-runtime-dependencies.txt
          if-no-files-found: error
          retention-days: 14
