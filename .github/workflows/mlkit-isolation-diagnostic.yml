name: ML Kit isolated diagnostic and APK219 Firebase forensics
on:
  workflow_dispatch:
  push:
    branches: [ mlkit-isolation-diagnostic ]
permissions:
  contents: read
  actions: read
concurrency:
  group: mlkit-isolation-diagnostic
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone ML Kit diagnostic
        run: |
          set -euo pipefail
          gradle --no-daemon -p diagnostics/mlkit-isolated :app:assembleDebug
          gradle --no-daemon -p diagnostics/mlkit-isolated :app:dependencies --configuration debugRuntimeClasspath > mlkit-runtime-dependencies.txt
          mkdir -p diagnostics-output
          cp diagnostics/mlkit-isolated/app/build/outputs/apk/debug/app-debug.apk diagnostics-output/MLKit-Isolated-Diagnostic.apk
          apkanalyzer manifest print diagnostics-output/MLKit-Isolated-Diagnostic.apk > diagnostics-output/isolated-manifest.txt
          apkanalyzer dex packages diagnostics-output/MLKit-Isolated-Diagnostic.apk > diagnostics-output/isolated-dex-packages.txt
          unzip -t diagnostics-output/MLKit-Isolated-Diagnostic.apk | tail -n 2
      - name: Download base APK 219
        uses: actions/download-artifact@v4
        with:
          name: TapTranslate-1.125-FontFit-AutoFill-HyMT2-Vulkan-unsigned
          run-id: 43736943007
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/run219
      - name: Download failing merged APK from build 75
        uses: actions/download-artifact@v4
        with:
          name: TapTranslate-STQ1_0-APK219-unsigned
          run-id: 44307994539
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/merged75
      - name: Decode and trace Firebase component registrars in base and failed merge
        shell: bash
        run: |
          set -euo pipefail
          base="input/run219/TapTranslate_1.125_FontFit_AutoFill_HyMT2_Vulkan_unsigned.apk"
          merged="input/merged75/TapTranslate_1.125_FontFit_AutoFill_HyMT2_STQ1_0_APK219_unsigned.apk"
          test -s "$base"
          test -s "$merged"
          echo "0e0d30f30a98fa427a62d23c6fe670e9bd9781287da2515b1b8139f9332e82eb  $base" | sha256sum -c -
          sha256sum "$merged" > diagnostics-output/failed-merge-sha256.txt
          java -jar tools/apktool.jar d -f -o build/base219 "$base" >/dev/null
          java -jar tools/apktool.jar d -f -o build/merged75 "$merged" >/dev/null
          mkdir -p diagnostics-output/base219 diagnostics-output/merged75

          inspect_tree() {
            label="$1"
            root="$2"
            out="diagnostics-output/$label"
            {
              echo "=== APK SHA ==="
              if [ "$label" = "base219" ]; then sha256sum "$base"; else sha256sum "$merged"; fi
              echo
              echo "=== FIREBASE COMPONENT DISCOVERY METADATA IN MANIFEST ==="
              grep -n -B5 -A5 'com.google.firebase.components:' "$root/AndroidManifest.xml" || true
              echo
              echo "=== SERVICES / PROVIDERS FOR ML KIT OR FIREBASE ==="
              grep -n -E 'MlKit|Firebase|firebase.components|Crashlytics|Sessions|Transport' "$root/AndroidManifest.xml" || true
              echo
              echo "=== CLASSES IMPLEMENTING ComponentRegistrar ==="
              find "$root"/smali* -type f -name '*.smali' -print0 |
                while IFS= read -r -d '' f; do
                  if grep -q '^\.implements Lcom/google/firebase/components/ComponentRegistrar;' "$f"; then
                    echo "----- $f"
                    grep -n -A100 -B5 -E '^\.class|^\.implements|^\.method .*getComponents|Lid/a;|Lcom/google/firebase/components/Component;' "$f" || true
                  fi
                done
              echo
              echo "=== ALL SMALI FILES REFERENCING OLD Component DESCRIPTOR Lid/a ==="
              grep -R -l -F 'Lid/a;' "$root"/smali* | sort || true
              echo
              echo "=== REGISTRAR METHOD CALLS / LEGACY Component FACTORIES ==="
              grep -R -n -E 'getComponents\(\)Ljava/util/List;|Lid/a;->c|Lid/a;->b|Lid/a;->a' "$root"/smali* | head -n 2500 || true
              echo
              echo "=== OLD COMPONENT CLASS AND CORE FACTORY / REGISTRAR CLASSES ==="
              for rel in id/a.smali id/g.smali id/f.smali la/v.smali gf/g.smali gf/m.smali ba/df.smali ba/sd.smali com/google/mlkit/common/internal/CommonComponentRegistrar.smali com/google/mlkit/common/internal/MlKitComponentDiscoveryService.smali com/google/mlkit/nl/translate/NaturalLanguageTranslateRegistrar.smali com/google/firebase/components/ComponentRegistrar.smali com/google/firebase/components/ComponentRuntime.smali com/google/firebase/components/CycleDetector.smali com/google/firebase/components/ComponentDiscovery.smali; do
                f=$(find "$root"/smali* -path "*/$rel" -print -quit)
                if [ -n "$f" ]; then echo "----- $f"; cat "$f"; fi
              done
            } > "$out/firebase-component-trace.txt"
          }

          inspect_tree base219 build/base219
          inspect_tree merged75 build/merged75
      - name: Upload detailed Firebase component trace
        uses: actions/upload-artifact@v4
        with:
          name: MLKit-Firebase-component-forensics
          path: |
            diagnostics-output/
            mlkit-runtime-dependencies.txt
          if-no-files-found: error
          retention-days: 14
