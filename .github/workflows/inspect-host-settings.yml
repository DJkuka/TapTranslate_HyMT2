name: Inspect Tap Translate host callbacks and settings screens

on:
  workflow_dispatch:
  push:
    branches:
      - ocr-paddle-prototype

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the exact Tap Translate base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input build/decoded diagnostics
          curl --fail --location --retry 4 \
            "https://github.com/DJkuka/TapTranslate_HyMT2/releases/download/1/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" \
            -o input/base.apk
          echo "dfe0463c9d9c0bf39451586e4e7aa405f5721504c61f20cef9fd122618418d83  input/base.apk" | sha256sum -c -

      - name: Decode APK and collect host settings and callback sources
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f -o build/decoded input/base.apk
          {
            echo "=== MANIFEST ACTIVITIES ==="
            grep -n -E '<activity|<activity-alias' build/decoded/AndroidManifest.xml || true
            echo
            echo "=== SETTINGS-LIKE LAYOUT FILES ==="
            find build/decoded/res/layout* -type f -iname '*setting*' -o -iname '*main*' | sort
            echo
            echo "=== ALL LAYOUT FILES ==="
            find build/decoded/res -maxdepth 2 -type f -path '*/layout*/*.xml' | sort
            echo
            echo "=== ACTIVITY SMALI FILES ==="
            find build/decoded/smali* -type f -name '*.smali' | grep -E '/activitys/|Settings|MainActivity|HomeActivity' | sort | head -n 500
          } > diagnostics/index.txt

          mkdir -p diagnostics/smali diagnostics/layout diagnostics/values
          for f in \
            build/decoded/smali_classes3/yh/f.smali \
            build/decoded/smali_classes3/yh/h.smali \
            build/decoded/smali_classes3/com/tap_to_translate/snap_translate/domain/main/activitys/SettingsServiceActivity.smali; do
            if [ -f "$f" ]; then cp "$f" diagnostics/smali/; fi
          done

          # Save all activity class smali plus settings-like resource layouts and values.
          find build/decoded/smali* -type f -name '*.smali' \
            | grep -E '/(activitys|activities)/|Settings.*Activity|Main.*Activity|Home.*Activity' \
            | while IFS= read -r f; do cp --parents "$f" diagnostics/smali/; done || true
          find build/decoded/res -type f -path '*/layout*/*.xml' \
            | while IFS= read -r f; do
                if grep -qiE 'setting|preference|main|home|menu' "$f"; then cp --parents "$f" diagnostics/layout/; fi
              done
          cp build/decoded/AndroidManifest.xml diagnostics/
          cp build/decoded/res/values/public.xml diagnostics/values/ 2>/dev/null || true
          cp build/decoded/res/values/ids.xml diagnostics/values/ 2>/dev/null || true

          # Include method/callback and activity declarations for compact grep-based reading.
          grep -R -n -E 'field .* (a|b|d):|\.method .*\(|SettingsServiceActivity|setContentView|inflate\(' \
            diagnostics/smali > diagnostics/declarations.txt || true
          # Capture host Smali classes declaring/reading display and manga preferences.
          mkdir -p diagnostics/relevant-smali
          pattern='HAWK_MANGA|manga_font|manga_background|manga_vertical|manga_upcase|vertical_text_new|center_text|background_stroke|font_size|font_type|home_wcv_font_size|home_ll_style|home_ll_choose_font|bubble.*alpha|text.*alpha|opacity|fontFamily|Typeface|textSize|setTextSize|setGravity'
          find build/decoded/smali* -type f -name '*.smali' -print0 | while IFS= read -r -d '' f; do
            if grep -qEi "$pattern" "$f"; then
              cp --parents "$f" diagnostics/relevant-smali/
            fi
          done
          grep -R -n -i -E "$pattern" build/decoded/smali* > diagnostics/relevant-smali-index.txt || true

          # Capture exact live host classes needed for display profiles and translated-area screenshots.
          mkdir -p diagnostics/host-flow
          for root in build/decoded/smali*; do
            [ -d "$root" ] || continue
            for rel in \
              "rh/c.smali" "rh/a.smali" "rh/h.smali" "rh/f.smali" \
              "xh/c.smali" "xh/a.smali" "xh/b.smali" \
              "ca/d2.smali" "ca/g2.smali" "qh/n.smali" \
              "kh/v.smali" "mh/l.smali" \
              "com/tap_to_translate/snap_translate/domain/main/service/ScreenTranslateService.smali" \
              "com/tap_to_translate/snap_translate/domain/main/activitys/TransparentActivity.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "diagnostics/host-flow/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "diagnostics/host-flow/$(basename "$root")/$rel"
              fi
            done
          done
          grep -R -n -E 'Lrh/c;->|Lxh/c;->|Lca/d2;->|Lqh/n;->|Lkh/v;->|HAWK_(MANGA|VERTICAL|UPCASE|CENTER|FONT|STYLE|BACKGROUND|TEXT)' \
            build/decoded/smali* > diagnostics/host-flow-call-sites.txt || true

          # Capture the exact Home layout and every host class involved in floating
          # container touch handling / double-tap mode transitions.
          if [ -f build/decoded/res/layout/fragment_home.xml ]; then
            cp build/decoded/res/layout/fragment_home.xml diagnostics/layout/
          fi
          mkdir -p diagnostics/touch-flow
          touch_pattern='rlContainViewAdd|ContainViewAdd|isConsideredDoubleTap|onDoubleTap|onSingleTapConfirmed|onDoubleTapEvent|GestureDetector|setOnDoubleTapListener|FLAG_NOT_TOUCHABLE|FLAG_NOT_TOUCH_MODAL|setTouchable|setTouchModal|isTouchable|ACTION_POINTER_DOWN'
          find build/decoded/smali* -type f -name '*.smali' -print0 | while IFS= read -r -d '' f; do
            if grep -qEi "$touch_pattern" "$f"; then
              cp --parents "$f" diagnostics/touch-flow/
            fi
          done
          grep -R -n -i -E "$touch_pattern" build/decoded/smali* > diagnostics/touch-flow-index.txt || true

          # Exact floating-icon double-tap path: listener, gesture callback,
          # coordinate callback and selection-overlay view.
          mkdir -p diagnostics/floating-icon
          for root in build/decoded/smali*; do
            [ -d "$root" ] || continue
            for rel in \
              "lb/b.smali" \
              "sh/b.smali" \
              "me/c.smali" \
              "com/tap_to_translate/snap_translate/domain/main/widgets/FloatingIconWidget.smali" \
              "com/tap_to_translate/snap_translate/domain/main/activitys/CameraTranslateActivity.smali" \
              "com/tap_to_translate/snap_translate/domain/main/activitys/TransparentActivity.smali" \
              "com/tap_to_translate/snap_translate/domain/main/service/ScreenTranslateService.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "diagnostics/floating-icon/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "diagnostics/floating-icon/$(basename "$root")/$rel"
              fi
            done
          done
          grep -R -n -E 'Llb/b;-><init>|Lsh/b;-><init>|Lme/c;->|FloatingIconWidget;->|HAWK_.*(SELECT|MANUAL|REGION)|manual.*(select|region)|select.*(region|area)' \
            build/decoded/smali* > diagnostics/floating-icon-call-sites.txt || true

          # Exact native OCR selector callback and both overlay layouts.
          mkdir -p diagnostics/selector-overlay/smali diagnostics/selector-overlay/layout
          for root in build/decoded/smali*; do
            [ -d "$root" ] || continue
            for rel in "lh/g.smali" "vh/l.smali" "rh/b.smali" "rh/c.smali" "rh/e.smali"; do
              if [ -f "$root/$rel" ]; then cp --parents "$root/$rel" diagnostics/selector-overlay/smali/; fi
            done
          done
          for rel in "widget_icon_floating.xml" "container_widget.xml"; do
            if [ -f "build/decoded/res/layout/$rel" ]; then cp "build/decoded/res/layout/$rel" diagnostics/selector-overlay/layout/; fi
          done
          grep -R -n -E 'HAWK_OCR|Lvh/l;->|Llh/g;->|fragment_home_ll_OCR_engine' \
            build/decoded/smali* > diagnostics/selector-overlay-call-sites.txt || true
          grep -R -n -E 'fragment_home_ll_(OCR|translation)_engine|fragment_home_tv_(OCR|translation)_engine' \
            build/decoded/res/layout* build/decoded/res/values/ids.xml build/decoded/res/values/public.xml \
            > diagnostics/home-ocr-layout-index.txt || true

          # Include exact host custom-widget implementations used by profile controls.
          find build/decoded/smali* -type f -name '*.smali' -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              */WidgetChooseFont.smali|*/WidgetChooseStyleNew.smali|*/WidgetChooseValue.smali|*/WidgetSwitch.smali)
                cp --parents "$f" diagnostics/relevant-smali/
                ;;
            esac
          done
          grep -R -n -E 'WidgetChoose(Font|StyleNew|Value|Switch)|HAWK_(BG_TRANS|FONT_FULL|FONT_SIZE|BG_STROKE)' build/decoded/smali* > diagnostics/profile-control-index.txt || true

          # Include app strings and resource references used by the display controls.
          mkdir -p diagnostics/values-all
          find build/decoded/res/values* -maxdepth 1 -type f \
            \( -name 'strings.xml' -o -name 'public.xml' -o -name 'ids.xml' \) \
            | while IFS= read -r f; do cp --parents "$f" diagnostics/values-all/; done
          grep -R -n -i -E 'manga|vertical text|center text|font|background stroke|font size|text size' \
            build/decoded/res/values* > diagnostics/resource-string-index.txt || true

          # Exact native OCR popup callback and wrapper implementation.
          mkdir -p diagnostics/ocr-popup
          for root in build/decoded/smali*; do
            [ -d "$root" ] || continue
            for rel in "w5/i.smali" "kh/o.smali" "mh/m.smali" "ca/yg.smali" "ca/d0.smali" "ca/ah.smali" "com/google/android/gms/internal/ads/uz0.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "diagnostics/ocr-popup/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "diagnostics/ocr-popup/$(basename "$root")/$rel"
              fi
            done
          done
          grep -R -n -E 'MLKitFbInstsRestClient|127\\.0\\.0\\.1/source_code=@NURIK|fragment_setting_ll_policy|NURIK|4PDA|Lw5/i;->|Lcom/google/android/gms/internal/ads/uz0;->' build/decoded/smali* build/decoded/res/layout* build/decoded/res/values* > diagnostics/ocr-popup-index.txt || true

          # Exact callback interface and footer attribution click wiring.
          mkdir -p diagnostics/ocr-popup-callback diagnostics/attribution
          for root in build/decoded/smali*; do
            [ -d "$root" ] || continue
            for rel in "kh/o.smali" "kh/f.smali" "p7/a.smali" "mh/m.smali"; do
              if [ -f "$root/$rel" ]; then
                mkdir -p "diagnostics/ocr-popup-callback/$(basename "$root")/$(dirname "$rel")"
                cp "$root/$rel" "diagnostics/ocr-popup-callback/$(basename "$root")/$rel"
              fi
            done
            while IFS= read -r -d '' f; do
              mkdir -p "diagnostics/attribution/$(basename "$root")/$(dirname "${f#"$root"/}")"
              cp "$f" "diagnostics/attribution/$(basename "$root")/${f#"$root"/}"
            done < <(find "$root" -type f -name '*.smali' -print0 | xargs -0 -r grep -lZ 'fragment_setting_ll_policy' || true)
          done
          grep -R -n -E 'fragment_setting_ll_policy|NURIK \\| 4PDA|MLKitFbInstsRestClient' diagnostics/attribution diagnostics/ocr-popup-callback > diagnostics/attribution-index.txt || true

          zip -qr diagnostics.zip diagnostics

      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-host-source-inspection
          path: diagnostics.zip
          if-no-files-found: error
          retention-days: 7
