name: OCR hybrid technical audit

on:
  push:
    branches: [ocr-hybrid-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify exact Tap Translate base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input build
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/DJkuka/TapTranslate_HyMT2/releases/download/1/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" \
            -o input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk
          echo "dfe0463c9d9c0bf39451586e4e7aa405f5721504c61f20cef9fd122618418d83  input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk" | sha256sum -c -

      - name: Decode APK
        run: java -jar tools/apktool.jar d -f -o build/decoded input/TapTranslate_1.125_FontFit_AutoFill_HyMT2_unsigned.apk

      - name: Trace exact OCR and screenshot call graph
        run: python3 scripts/audit_ocr_detail.py build/decoded build/ocr_detail

      - name: Publish detailed smali call graph
        uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-OCR-hybrid-detail
          path: build/ocr_detail/
          if-no-files-found: error
          retention-days: 14
