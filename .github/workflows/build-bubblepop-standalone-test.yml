name: Build BubblePop standalone diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ bubblepop-standalone-test ]
    paths:
      - "bubblepop-test/**"
      - ".github/workflows/build-bubblepop-standalone-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned BubblePop model and license
        shell: bash
        run: |
          set -euo pipefail
          model_dir="bubblepop-test/app/src/main/assets/models/bubblepop"
          mkdir -p "$model_dir"
          base="https://raw.githubusercontent.com/xulihang/speech-balloon-segmentation/a6a5abae641891e80ef6eaf28d307c808ad5657d"
          curl --fail --location --retry 4 --retry-all-errors "$base/models/model_fp16.onnx" -o "$model_dir/model_fp16.onnx"
          curl --fail --location --retry 4 --retry-all-errors "$base/LICENSE.bubble-pop" -o "$model_dir/LICENSE.bubble-pop"
          test "$(stat -c%s "$model_dir/model_fp16.onnx")" -gt 100000
          test -s "$model_dir/LICENSE.bubble-pop"
          sha256sum "$model_dir/model_fp16.onnx"

      - name: Require persistent Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEPOP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEPOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUBBLEPOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUBBLEPOP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing BUBBLEPOP_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing BUBBLEPOP_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BUBBLEPOP_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BUBBLEPOP_KEY_PASSWORD repository secret"; exit 1; }

      - name: Build standalone release APK
        run: gradle --no-daemon -p bubblepop-test :app:assembleRelease

      - name: Sign APK with persistent GitHub Actions keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEPOP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEPOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUBBLEPOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUBBLEPOP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="bubblepop-test/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p build/signing build/out
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/signing/bubblepop-release.jks
          test -s build/signing/bubblepop-release.jks
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$unsigned" build/out/BubblePop_Standalone_Test_aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build/signing/bubblepop-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out build/out/BubblePop_Standalone_Test_signed.apk \
            build/out/BubblePop_Standalone_Test_aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/out/BubblePop_Standalone_Test_signed.apk
          sha256sum build/out/BubblePop_Standalone_Test_signed.apk
          ls -lh build/out/BubblePop_Standalone_Test_signed.apk

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/out/BubblePop_Standalone_Test_signed.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"
          unzip -Z1 "$apk" | grep -Fx "assets/models/bubblepop/model_fp16.onnx"
          unzip -Z1 "$apk" | grep -Fx "assets/models/bubblepop/LICENSE.bubble-pop"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload signed diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: BubblePop-Standalone-Test-signed
          path: build/out/BubblePop_Standalone_Test_signed.apk
          if-no-files-found: error
          retention-days: 30
