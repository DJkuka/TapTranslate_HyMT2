name: Build BubblePop standalone diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ bubblepop-standalone-test ]
    paths:
      - "bubblepop-test/**"
      - ".github/workflows/build-bubblepop-standalone-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned BubblePop model and license
        shell: bash
        run: |
          set -euo pipefail
          model_dir="bubblepop-test/app/src/main/assets/models/bubblepop"
          mkdir -p "$model_dir"
          base="https://raw.githubusercontent.com/xulihang/speech-balloon-segmentation/a6a5abae641891e80ef6eaf28d307c808ad5657d"
          curl --fail --location --retry 4 --retry-all-errors "$base/models/model_fp16.onnx" -o "$model_dir/model_fp16.onnx"
          curl --fail --location --retry 4 --retry-all-errors "$base/LICENSE.bubble-pop" -o "$model_dir/LICENSE.bubble-pop"
          test "$(stat -c%s "$model_dir/model_fp16.onnx")" -gt 100000
          test -s "$model_dir/LICENSE.bubble-pop"
          sha256sum "$model_dir/model_fp16.onnx"

      - name: Build standalone release APK (unsigned)
        run: gradle --no-daemon -p bubblepop-test :app:assembleRelease

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          apk="bubblepop-test/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"
          unzip -Z1 "$apk" | grep -Fx "assets/models/bubblepop/model_fp16.onnx"
          unzip -Z1 "$apk" | grep -Fx "assets/models/bubblepop/LICENSE.bubble-pop"
          if unzip -Z1 "$apk" | grep -Eiq '^META-INF/[^/]+\\.(RSA|DSA|EC|SF)$'; then
            echo "Unexpected v1 signature files in APK"
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo "APK unexpectedly contains an APK signature"
            exit 1
          else
            echo "Unsigned APK confirmed"
          fi
          mkdir -p build/out
          cp "$apk" build/out/BubblePop_Standalone_Test_unsigned.apk
          sha256sum build/out/BubblePop_Standalone_Test_unsigned.apk
          ls -lh build/out/BubblePop_Standalone_Test_unsigned.apk

      - name: Upload unsigned diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: BubblePop-Standalone-Test-unsigned
          path: build/out/BubblePop_Standalone_Test_unsigned.apk
          if-no-files-found: error
          retention-days: 30
